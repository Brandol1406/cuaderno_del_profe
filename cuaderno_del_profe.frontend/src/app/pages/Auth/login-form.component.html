<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-lg p-4 animate__animated animate__fadeIn" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4 text-primary">Iniciar Sesión</h3>
    
    <form (ngSubmit)="onSubmit($event)" #loginForm="ngForm">
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input
          type="text"
          id="username"
          class="form-control"
          name="username"
          [(ngModel)]="model.Usuario"
          required
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input
          type="password"
          id="password"
          class="form-control"
          name="password"
          [(ngModel)]="model.Contrasena"
          required
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-sm w-100"
        [disabled]="!loginForm.form.valid"
      >
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
