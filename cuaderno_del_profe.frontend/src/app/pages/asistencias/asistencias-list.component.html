<h2>Pases de lista</h2>
<a routerLink="/Asistencias/new"
  class="btn btn-sm btn-primary mb-2"
  ><i class="bi bi-plus-circle"></i> Agregar nuevo
</a>

<table class="table table-bordered table-sm table-striped">
  <colgroup>
    <col [width]="'30%'">
    <col [width]="'30%'">
    <col [width]="'20%'">
    <col [width]="'20%'">
  </colgroup>
  <thead>
    <tr>
      <th>Periodo</th>
      <th>Materia</th>
      <th>Fecha</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of items">
      <td>{{item.periodo}}</td>
      <td>{{item.materia}}</td>
      <td>{{item.fecha | date:'dd/MM/yyyy'}}</td>
      <td>
        <a [routerLink]="['/Asistencias/edit', item.idAsistencia]" class="btn btn-sm btn-primary"><i class="bi bi-pencil-square"></i> Editar</a>
        <button (click)="deleteItem(item.idAsistencia)" class="btn btn-sm btn-danger ms-2"><i class="bi bi-trash"></i> Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>

<a routerLink="/">Volver al inicio</a>
