<form (ngSubmit)="onSubmit($event)" #form="ngForm">
  <div class="d-flex justify-content-between align-items-center p-2 sticky-top bg-light mb-2 border rounded">
    <div>
      <h2>{{ isEdit ? 'Editar' : 'Agregar' }}</h2>
    </div>
    <div>
      <button type="submit" class="btn btn-sm btn-primary" [disabled]="!form.form.valid"><i class="bi bi-floppy"></i> {{
        isEdit ? 'Actualizar' : 'Crear' }}</button>
      <a routerLink="/Calificaciones/List" class="btn btn-sm btn-secondary ms-2"><i class="bi bi-arrow-return-left"></i>
        Volver</a>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card">
        <div class="card-header">
          <div class="d-flex justify-content-between align-items-center">
            <div>Datos generales</div>
            <div><span *ngIf="model.calificacion1 != null" class="badge {{obtenerLiteralColor(model.calificacion1)}}">{{obtenerLiteral(model.calificacion1)}}</span></div>
          </div>
           
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-12 form-group">
              <label>Periodo:</label><br />
              <select [(ngModel)]="model.idPeriodo" name="idPeriodo" class="form-control form-control-sm"
                required>
                <option [ngValue]="null">Seleccione</option>
                <option [ngValue]="item.idPeriodo" *ngFor="let item of periodos">{{item.nombre}}</option>
              </select>
              <small *ngIf="errors['idPeriodo']" class="text-danger">{{
                errors["idPeriodo"]
                }}</small>
            </div>
            <div class="col-12 form-group">
              <label>Materia:</label><br />
              <select [(ngModel)]="model.idMateria" name="idMateria" class="form-control form-control-sm"
                required>
                <option [ngValue]="null">Seleccione</option>
                <option [ngValue]="item.idMateria" *ngFor="let item of materias">{{item.nombre}}</option>
              </select>
              <small *ngIf="errors['idMateria']" class="text-danger">{{
                errors["idMateria"]
                }}</small>
            </div>
            <div class="col-12 form-group">
              <label>Estudiante:</label><br />
              <select [(ngModel)]="model.idEstudiante" name="idEstudiante" class="form-control form-control-sm"
                required>
                <option [ngValue]="null">Seleccione</option>
                <option [ngValue]="item.idEstudiante" *ngFor="let item of filteredInscripciones()">{{item.estudiante}} {{item.matricula}}</option>
              </select>
              <small *ngIf="errors['idEstudiante']" class="text-danger">{{
                errors["idEstudiante"]
                }}</small>
            </div>
            <div class="col-12 form-group">
              <label>Calificación:</label><br />
              <input [(ngModel)]="model.calificacion1" type="number" name="calificacion1" class="form-control form-control-sm" min="0" max="100" required>
              <small *ngIf="errors['calificacion1']" class="text-danger">{{
                errors["calificacion1"]
                }}</small>
            </div>
            <div class="col-12 form-group">
              <label>Fecha evaluación:</label><br />
              <input [(ngModel)]="model.fevaluacion" name="fevaluacion" type="datetime-local"
                class="form-control form-control-sm" />
              <small *ngIf="errors['Fevaluacion']" class="text-danger">{{
                errors["Fevaluacion"]
                }}</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
