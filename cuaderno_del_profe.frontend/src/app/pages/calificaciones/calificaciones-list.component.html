<h2>Listado calificaciones</h2>
<div class="d-flex justify-content-between align-items-center p-2 sticky-top bg-light mb-2 border rounded">
  <div>
    <input type="search" class="form-control form-control-sm" placeholder="Buscar..." [(ngModel)]="searchText">
  </div>
  <div>
    <a routerLink="/Calificaciones/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> Agregar nuevo</a>
  </div>
</div>

<table class="table table-bordered table-sm table-striped">
  <colgroup>
    <col [width]="'20%'">
    <col [width]="'20%'">
    <col [width]="'10%'">
    <col [width]="'25%'">
    <col [width]="'10%'">
    <col [width]="'15%'">
  </colgroup>
  <thead>
    <tr>
      <th>Período</th>
      <th>Materia</th>
      <th>Matrícula</th>
      <th>estudiante</th>
      <th>Calificación</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of items | filterText:searchText:['periodo', 'materia', 'matricula', 'estudiante']">
      <td>{{item.periodo}}</td>
      <td>{{item.materia}}</td>
      <td>{{item.matricula}}</td>
      <td>{{item.estudiante}}</td>
      <td>
        <span class="badge {{obtenerLiteralColor(item.calificacion1)}}">{{obtenerLiteral(item.calificacion1)}}</span> <small> ({{item.calificacion1}})</small>
      </td>
      <td>
        <a [routerLink]="['/Calificaciones/edit', item.idCalificacion]" class="btn btn-sm btn-primary"><i class="bi bi-pencil-square"></i> Editar</a>
        <button (click)="deleteItem(item.idCalificacion)" class="btn btn-sm btn-danger ms-2"><i class="bi bi-trash"></i> Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>

<a routerLink="/">Volver al inicio</a>
