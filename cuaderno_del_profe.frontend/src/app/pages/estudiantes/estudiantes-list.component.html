<h2>Listado estudiantes</h2>
<div class="d-flex justify-content-between align-items-center p-2 sticky-top bg-light mb-2 border rounded">
  <div>
    <input type="search" class="form-control form-control-sm" placeholder="Buscar..." [(ngModel)]="searchText">
  </div>
  <div>
    <a routerLink="/Estudiantes/new" class="btn btn-sm btn-primary">
      <i class="bi bi-plus-circle"></i>
      Agregar nuevo
    </a>
  </div>
</div>

<table class="table table-bordered table-sm table-striped">
  <colgroup>
    <col [width]="'20%'">
    <col [width]="'30%'">
    <col [width]="'30%'">
    <col [width]="'20%'">
  </colgroup>
  <thead>
    <tr>
      <th>matrícula</th>
      <th>Nombres</th>
      <th>Apellidos</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of items | filterText:searchText:['nombres', 'apellidos', 'matricula']">
      <td>{{item.matricula}}</td>
      <td>{{item.nombres}}</td>
      <td>{{item.apellidos}}</td>
      <td>
        <a [routerLink]="['/Estudiantes/edit', item.idEstudiante]" class="btn btn-sm btn-primary"><i
            class="bi bi-pencil-square"></i> Editar</a>
        <button (click)="deleteItem(item.idEstudiante)" class="btn btn-sm btn-danger ms-2"><i class="bi bi-trash"></i>
          Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>

<a routerLink="/">Volver al inicio</a>
