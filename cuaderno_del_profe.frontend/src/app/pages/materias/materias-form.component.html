<h2>{{ isEdit ? 'Editar' : 'Agregar' }} Item</h2>
<form (ngSubmit)="onSubmit($event)">
  <label>Nombre:</label><br />
  <input [(ngModel)]="model.nombre" name="Nombre" required /><br />
  <small *ngIf="errors['Nombre']" class="p-error">{{
              errors["Nombre"]
            }}</small>
  <label>Descripción:</label><br />
  <textarea [(ngModel)]="model.descripcion" name="Descripcion" required></textarea><br />
  <button type="submit">{{ isEdit ? 'Actualizar' : 'Crear' }}</button>
</form>
