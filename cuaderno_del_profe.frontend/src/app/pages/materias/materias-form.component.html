<form (ngSubmit)="onSubmit($event)" #form="ngForm">
  <div class="d-flex justify-content-between align-items-center p-2 sticky-top bg-light mb-2 border rounded">
    <div>
      <h2>{{ isEdit ? 'Editar' : 'Agregar' }}</h2>
    </div>
    <div>
      <button type="submit" class="btn btn-sm btn-primary" [disabled]="!form.form.valid"><i class="bi bi-floppy"></i> {{
        isEdit ? 'Actualizar' : 'Crear' }}</button>
      <a routerLink="/Materias/List" class="btn btn-sm btn-secondary ms-2"><i class="bi bi-arrow-return-left"></i>
        Volver</a>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-6 col-md-6 col-sm-12">
      <div class="card">
        <div class="card-header">
          Datos generales
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-12 form-group">
              <label>Nombre:</label><br />
              <input [(ngModel)]="model.nombre" name="Nombre" class="form-control form-control-sm" required />
              <small *ngIf="errors['Nombre']" class="text-danger">{{
                errors["Nombre"]
                }}</small>
            </div>
            <div class="col-12 form-group">
              <label>Descripción:</label><br />
              <textarea [(ngModel)]="model.descripcion" name="Descripcion" class="form-control form-control-sm"
                required></textarea><br />
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-6 col-md-6 col-sm-12">
      <div class="card">
        <div class="card-header">
          Inscripciones
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-12 form-group">
              <label>Periodo</label>
              <select class="form-control form-control-sm" [(ngModel)]="selectPeriodo" name="selectPeriodo"
                id="selectPeriodo">
                <option [ngValue]="0">Seleccione</option>
                <option [ngValue]="item.idPeriodo" *ngFor="let item of periodos">{{item.nombre}}</option>
              </select>
            </div>
            <div class="col-12 mt-2">
              <table class="table table-striped table-bordered table-sm">
                <colgroup>
                  <col width="20%">
                  <col width="70%">
                  <col width="10%">
                </colgroup>
                <thead>
                  <tr>
                    <th>Matricula</th>
                    <th>Estudiante</th>
                    <th>Inscrito</th>
                  </tr>
                </thead>
                <tbody>

                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
