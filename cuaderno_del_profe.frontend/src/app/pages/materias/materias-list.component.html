<h2>Listado</h2>
<a routerLink="/Materias/new">Agregar nuevo</a>

<table>
  <colgroup>
    <col [width]="'10%'">
    <col [width]="'40%'">
    <col [width]="'40%'">
    <col [width]="'10%'">
  </colgroup>
  <thead>
    <tr>
      <th>#</th>
      <th>Nombre</th>
      <th>Descripcion</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of items">
      <td>{{item.idMateria}}</td>
      <td>{{item.nombre}}</td>
      <td>{{item.descripcion}}</td>
      <td>
        <a [routerLink]="['/Materias/edit', item.idMateria]">Editar</a>
        <button (click)="deleteItem(item.idMateria)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>

<a routerLink="/">Volver al inicio</a>
