<h2>Listado materias</h2>
<div class="d-flex justify-content-between align-items-center p-2 sticky-top bg-light mb-2 border rounded">
  <div>
    <input type="search" class="form-control form-control-sm" placeholder="Buscar..." [(ngModel)]="searchText">
  </div>
  <div>
    <a routerLink="/Materias/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> Agregar nuevo</a>
  </div>
</div>

<table class="table table-bordered table-sm table-striped">
  <colgroup>
    <col [width]="'40%'">
    <col [width]="'40%'">
    <col [width]="'20%'">
  </colgroup>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Descripcion</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of items | filterText:searchText:['nombre', 'descripcion']">
      <td>{{item.nombre}}</td>
      <td>{{item.descripcion}}</td>
      <td>
        <a [routerLink]="['/Materias/edit', item.idMateria]" class="btn btn-sm btn-primary"><i class="bi bi-pencil-square"></i> Editar</a>
        <button (click)="deleteItem(item.idMateria)" class="btn btn-sm btn-danger ms-2"><i class="bi bi-trash"></i> Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>

<a routerLink="/">Volver al inicio</a>
