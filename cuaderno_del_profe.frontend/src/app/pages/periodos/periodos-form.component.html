<h2>{{ isEdit ? 'Editar' : 'Agregar' }}</h2>
<form (ngSubmit)="onSubmit($event)">
  <div class="row">
    <div class="col-12 form-group">
      <label>Nombre:</label><br />
      <input [(ngModel)]="model.nombre" name="Nombre" class="form-control form-control-sm" required />
      <small *ngIf="errors['Nombre']" class="text-danger">{{
        errors["Nombre"]
        }}</small>
    </div>
    <div class="col-12 form-group">
      <label>Inicio:</label><br />
      <input [(ngModel)]="model.finicio" name="fInicio" type="date" class="form-control form-control-sm" required />
      <small *ngIf="errors['FInicio']" class="text-danger">{{
        errors["FInicio"]
        }}</small>
    </div>
    <div class="col-12 form-group">
      <label>Fin:</label><br />
      <input [(ngModel)]="model.ffin" name="ffin" type="date" class="form-control form-control-sm" required />
      <small *ngIf="errors['ffin']" class="text-danger">{{
        errors["Ffin"]
        }}</small>
    </div>
    <div class="col-12 form-group mt-2">
      <button type="submit" class="btn btn-sm btn-primary">{{ isEdit ? 'Actualizar' : 'Crear' }}</button>
      <a routerLink="/Periodos/List" class="btn btn-sm btn-secondary ml-2">Volver</a>
    </div>
  </div>
</form>
