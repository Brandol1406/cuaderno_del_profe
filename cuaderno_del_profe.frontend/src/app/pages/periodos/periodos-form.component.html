<form (ngSubmit)="onSubmit($event)" #form="ngForm">
  <div class="d-flex justify-content-between align-items-center p-2 sticky-top bg-light mb-2 border rounded">
    <div>
      <h2>{{ isEdit ? 'Editar' : 'Agregar' }}</h2>
    </div>
    <div>
      <button type="submit" class="btn btn-sm btn-primary" [disabled]="!form.form.valid"><i class="bi bi-floppy"></i> {{
        isEdit ? 'Actualizar' : 'Crear' }}</button>
      <a routerLink="/Periodos/List" class="btn btn-sm btn-secondary ms-2"><i class="bi bi-arrow-return-left"></i>
        Volver</a>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card">
        <div class="card-header">
          Datos generales
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-12 form-group">
              <label>Nombre:</label><br />
              <input [(ngModel)]="model.nombre" name="Nombre" class="form-control form-control-sm" required />
              <small *ngIf="errors['Nombre']" class="text-danger">{{
                errors["Nombre"]
                }}</small>
            </div>
            <div class="col-12 form-group">
              <label>Inicio:</label><br />
              <input [(ngModel)]="model.finicio" name="fInicio" type="date" class="form-control form-control-sm"
                required />
              <small *ngIf="errors['FInicio']" class="text-danger">{{
                errors["FInicio"]
                }}</small>
            </div>
            <div class="col-12 form-group">
              <label>Fin:</label><br />
              <input [(ngModel)]="model.ffin" name="ffin" type="date" class="form-control form-control-sm" required />
              <small *ngIf="errors['ffin']" class="text-danger">{{
                errors["Ffin"]
                }}</small>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</form>
